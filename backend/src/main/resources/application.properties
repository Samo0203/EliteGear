# ============================================================
# EliteGear — Spring Boot Application Properties
# ============================================================

# Server
server.port=8080

# Application name
spring.application.name=elitegear-backend

# MongoDB Connection
# Replace <username>, <password>, <cluster-url>, <dbname> with your Atlas details
# For local MongoDB use: mongodb://localhost:27017/elitegear
spring.mongodb.uri=mongodb://localhost:27017/elitegear
spring.mongodb.database=elitegear

# Enable @CreatedDate auditing
spring.data.mongodb.auto-index-creation=true

# Jackson — pretty print JSON responses
spring.jackson.serialization.indent_output=true

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.vau.ac.lk.backend=DEBUG